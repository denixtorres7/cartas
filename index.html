<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap');

@font-face{
  font-family:"NauryzRedKends";
  src:url("./fonts/NauryzRedKends-Bold.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Poppins", Arial, sans-serif;
}

.scene{
--color:#8A4FF5;
--shadow:#43108f;
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  background-image:var(--fondo);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.controls{
  position:absolute;
  top:3.2%;
  left:2.3%;
  z-index:30;
  display:flex;
  gap:14px;
}

button{
  background:#6d16d9;
  color:white;
  border:none;
  border-radius:18px;
  padding:16px 28px;
  font-size:18px;
  font-family:"Poppins", Arial, sans-serif;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.18);
}

.timer{
  position:absolute;
  top:10.8%;
  left:43.5%;
  z-index:25;
  display:flex;
  align-items:center;
  gap:10px;
  color:#000;
  font-size:34px;
  font-family:"Poppins", Arial, sans-serif;
  font-weight:700;
}

.timer img{
  width:44px;
  height:44px;
  object-fit:contain;
}

.timer-label{
  position:absolute;
  top:-16px;
  left:56px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.4px;
}

.player-box{
  position:absolute;
  top:8.7%;
  right:5.3%;
  z-index:25;
  width:250px;
}

.name-input{
  width:210px;
  height:34px;
  border:0;
  outline:none;
  border-radius:18px;
  padding:0 18px;
  font-size:18px;
  font-family:"Poppins", Arial, sans-serif;
  font-weight:700;
  color:#6d16d9;
  background:rgba(255,255,255,.75);
  text-transform:uppercase;
}

.name-input::placeholder{
  color:#6d16d9;
  opacity:.9;
}

.top-stars{
  margin-top:7px;
  display:flex;
  gap:6px;
}

.top-star{
  font-size:32px;
  color:#000;
  line-height:1;
  user-select:none;
}

.top-star.filled{
  color:var(--color);
}

/* CARTA HORIZONTAL */
.question-card{
  position:absolute;
  left:27.3%;
  top:40.5%;
  width:35%;
  height:28%;
  background:#fffdf6;
  border:4px solid #000;
  border-radius:22px;
  box-shadow:16px 18px 0 var(--color);
  z-index:8;
  transform:rotate(-1.5deg);
  padding:70px 42px 30px;
  box-sizing:border-box;
}

.label{
position:absolute;
top:-44px;
left:28px;
width:76%;
min-height:82px;

background:var(--color);

color:white;
border-radius:14px;

padding:12px 28px;

transform:rotate(-4deg);

display:flex;
align-items:center;
justify-content:center;

box-shadow:
10px 10px 0
var(--shadow);

z-index:20;
}

.label-title{
  font-family:"NauryzRedKends","Poppins",sans-serif;
  font-size:24pt;
  font-weight:700;
  line-height:.82;
  text-align:center;
  text-transform:uppercase;
}

.question{
  font-family:"Poppins",sans-serif;
  font-size:24pt;
  font-weight:500;
  line-height:1.08;
}

.counter{
  position:absolute;
  right:34px;
  top:34px;
  font-size:24px;
}

.answer-box{
  position:absolute;
  left:28.6%;
  top:73%;
  width:25.5%;
  height:5.8%;
  border:0;
  background:transparent;
  resize:none;
  outline:none;
  z-index:20;
  font-family:"Poppins";
  font-size:18px;
  padding:8px 18px;
  box-sizing:border-box;
}

.instruction{
  position:absolute;
  left:28.6%;
  top:83.6%;
  width:35.5%;
  text-align:center;
  font-size:20px;
}

/* CARTA VERTICAL */
.vertical-card{
  position:absolute;
  left:63.5%;
  top:23.8%;
  width:22%;
  height:58%;
  z-index:18;
  perspective:1200px;
  cursor:pointer;
}

.vertical-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .65s ease;
}

.vertical-card.open .vertical-inner{
  transform:rotateY(180deg);
}

.vertical-face{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:22px;
  overflow:hidden;
  backface-visibility:hidden;
  box-shadow:14px 18px 0 rgba(64,0,150,.65);
}

.vertical-cover{
  background:var(--color);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transform:rotate(8deg);
}

.vertical-front{
  background:#fff;
  transform:rotateY(180deg) rotate(8deg);
}

.vertical-front img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.close-card{
  position:absolute;
  top:12px;
  right:12px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#000;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:40;
}

.vertical-card.open .close-card{
display:flex;
}

.shuffle{
animation:shuffleVertical .7s ease;
}

@keyframes shuffleVertical{
0%{transform:translate(0,0) rotate(8deg);}
20%{transform:translate(-35px,18px) rotate(-7deg);}
45%{transform:translate(28px,-22px) rotate(13deg);}
70%{transform:translate(-18px,12px) rotate(-4deg);}
100%{transform:translate(0,0) rotate(8deg);}
}

</style>
</head>

<body>

<div class="scene" id="scene">

<div class="controls">
<button id="shuffleBtn">Barajar</button>
<button id="nextBtn">Siguiente</button>
</div>

<div class="timer" id="timer">
<img id="timerGif" src="">
<div>
<div class="timer-label">TIEMPO</div>
<span id="timeNumber">30</span>
</div>
</div>

<div class="player-box">
<input class="name-input" placeholder="TU NOMBRE">

<div class="top-stars">
<span class="top-star">☆</span>
<span class="top-star">☆</span>
<span class="top-star">☆</span>
<span class="top-star">☆</span>
<span class="top-star">☆</span>
<span class="top-star">☆</span>
</div>
</div>

<div class="question-card">

<div class="label">
<div class="label-title" id="cardTitle">
Cargando...
</div>
</div>

<div class="question" id="questionText"></div>

<div class="counter" id="counter">
1/1
</div>

</div>

<textarea
class="answer-box"
id="answerBox"
placeholder="Escribe aquí..."></textarea>

<div
class="instruction"
id="instructionText"></div>

<div class="vertical-card"
id="verticalCard">

<div class="close-card"
id="closeCard">✕</div>

<div class="vertical-inner">

<div
class="vertical-face vertical-cover">
</div>

<div
class="vertical-face vertical-front">

<img id="visualGraphic">

</div>

</div>
</div>

</div>

<script>
const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSqZdZ17KRyJDc6ybE8eZKia2XuQ4a5Tba6WzrhFDJ4ejSgZBDU4WdSH54pWkY1BGgZNe79S_77zMiS/pub?gid=343832896&single=true&output=csv";

let cardsData = [];
let currentIndex = 0;
let filledStars = 0;

const scene = document.getElementById("scene");
const cardTitle = document.getElementById("cardTitle");
const questionText = document.getElementById("questionText");
const instructionText = document.getElementById("instructionText");
const counter = document.getElementById("counter");
const visualGraphic = document.getElementById("visualGraphic");
const verticalCard = document.getElementById("verticalCard");
const answerBox = document.getElementById("answerBox");

function clean(v){
  return (v || "")
    .replace(/[“”]/g, '"')
    .replace(/^"|"$/g, "")
    .trim();
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cell = "";
  let quote = false;

  for(let i = 0; i < text.length; i++){
    const c = text[i];
    const n = text[i + 1];

    if(c === '"' && quote && n === '"'){
      cell += '"';
      i++;
    }else if(c === '"'){
      quote = !quote;
    }else if(c === "," && !quote){
      row.push(cell);
      cell = "";
    }else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
    }else{
      cell += c;
    }
  }

  if(cell || row.length){
    row.push(cell);
    rows.push(row);
  }

  const headers = rows[0].map(h => clean(h));

  return rows.slice(1).map(r => {
    const item = {};
    headers.forEach((h,i)=>{
      item[h] = clean(r[i]);
    });
    return item;
  }).filter(x => x.pregunta);
}

function loadSheet(){
  fetch(sheetURL + "&cache=" + Date.now())
    .then(r => r.text())
    .then(csv => {
      cardsData = parseCSV(csv);
      currentIndex = 0;
      renderCard();
    })
    .catch(error => {
      console.error(error);
      cardTitle.textContent = "ERROR";
      questionText.textContent = "No se pudo cargar Google Sheets.";
    });
}

function renderCard(){
  if(!cardsData.length) return;

  const card = cardsData[currentIndex];

  const color = clean(card.color) || "#8A4FF5";
  const shadow = clean(card.sombra) || "#43108f";

  scene.style.setProperty("--color", color);
  scene.style.setProperty("--shadow", shadow);

  cardTitle.textContent = clean(card.titulo) || "SIN TÍTULO";
  questionText.textContent = clean(card.pregunta);
  instructionText.textContent = clean(card.instruccion);
  counter.textContent = (currentIndex + 1) + "/" + cardsData.length;

  visualGraphic.src = clean(card.grafica_tiro);

  const cover = document.querySelector(".vertical-cover");
  cover.style.backgroundImage = `url("${clean(card.grafica_retiro)}")`;
  cover.style.backgroundSize = "cover";
  cover.style.backgroundPosition = "center";

  answerBox.value = "";
  verticalCard.classList.remove("open");
}

function shuffleCards(){
  if(!cardsData.length) return;

  cardsData.sort(() => Math.random() - 0.5);
  currentIndex = 0;

  verticalCard.classList.remove("open");
  verticalCard.classList.add("shuffle");

  setTimeout(() => {
    verticalCard.classList.remove("shuffle");
    renderCard();
  }, 700);
}

function nextCard(){
  if(!cardsData.length) return;

  currentIndex++;

  if(currentIndex >= cardsData.length){
    currentIndex = 0;
  }

  verticalCard.classList.remove("open");
  renderCard();
}

document.getElementById("shuffleBtn").addEventListener("click", shuffleCards);
document.getElementById("nextBtn").addEventListener("click", nextCard);

verticalCard.addEventListener("click", () => {
  verticalCard.classList.toggle("open");
});

answerBox.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();

    if(answerBox.value.trim() !== "" && filledStars < 6){
      const stars = document.querySelectorAll(".top-star");
      stars[filledStars].textContent = "★";
      stars[filledStars].classList.add("filled");
      filledStars++;
    }
  }
});

loadSheet();
</script>
</body>
</html>
