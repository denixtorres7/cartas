<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap');

@font-face{
  font-family:"NauryzRedKends";
  src:url("fonts/NauryzRedKends-Bold.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Poppins", Arial, sans-serif;
}

.scene{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  background-image:var(--fondo);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.controls{
  position:absolute;
  top:3.2%;
  left:2.3%;
  z-index:30;
  display:flex;
  gap:14px;
}

button{
  background:#6d16d9;
  color:white;
  border:none;
  border-radius:18px;
  padding:16px 28px;
  font-size:22px;
  font-family:"Poppins", Arial, sans-serif;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.18);
}

.timer{
  position:absolute;
  top:10.8%;
  left:43.5%;
  z-index:25;
  display:flex;
  align-items:center;
  gap:10px;
  color:#000;
  font-size:34px;
  font-family:"Poppins", Arial, sans-serif;
  font-weight:700;
}

.timer img{
  width:44px;
  height:44px;
  object-fit:contain;
}

.timer-label{
  position:absolute;
  top:-16px;
  left:56px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.4px;
}

.player-box{
  position:absolute;
  top:8.7%;
  right:5.3%;
  z-index:25;
  width:250px;
}

.name-input{
  width:210px;
  height:34px;
  border:0;
  outline:none;
  border-radius:18px;
  padding:0 18px;
  font-size:18px;
  font-family:"Poppins", Arial, sans-serif;
  font-weight:700;
  color:#6d16d9;
  background:rgba(255,255,255,.75);
  text-transform:uppercase;
}

.name-input::placeholder{
  color:#6d16d9;
  opacity:.9;
}

.top-stars{
  margin-top:7px;
  display:flex;
  gap:6px;
}

.top-star{
  font-size:32px;
  color:#000;
  line-height:1;
  user-select:none;
}

.top-star.filled{
  color:var(--color);
}

/* CARTA HORIZONTAL */
.question-card{
  position:absolute;
  left:27.3%;
  top:40.5%;
  width:35%;
  height:28%;
  background:#fffdf6;
  border:4px solid #000;
  border-radius:22px;
  box-shadow:16px 18px 0 var(--color);
  z-index:8;
  transform:rotate(-1.5deg);
  padding:70px 42px 30px;
  box-sizing:border-box;
}

.label{
  position:absolute;
  top:-44px;
  left:28px;
  width:76%;
  min-height:82px;
  background:var(--color);
  color:white;
  border-radius:10px;
  padding:10px 24px;
  transform:rotate(-4deg);
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
}

.label-title{
  font-family:"NauryzRedKends","Poppins",Arial,sans-serif;
  font-size:54pt;
  font-weight:700;
  line-height:.82;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.question{
  font-family:"Poppins", Arial, sans-serif;
  font-size:32pt;
  line-height:1.08;
  font-weight:500;
  color:#000;
  max-width:82%;
}

.counter{
  position:absolute;
  right:34px;
  top:34px;
  font-family:"Poppins", Arial, sans-serif;
  font-size:24px;
  font-weight:500;
  font-style:italic;
  color:#000;
}

/* CAJA DE RESPUESTA */
.answer-box{
  position:absolute;
  left:28.6%;
  top:73%;
  width:25.5%;
  height:5.8%;
  border:0;
  background:transparent;
  resize:none;
  outline:none;
  z-index:20;
  font-family:"Poppins", Arial, sans-serif;
  font-size:18px;
  line-height:1.25;
  padding:8px 18px;
  box-sizing:border-box;
  color:#333;
  font-weight:500;
}

.answer-box::placeholder{
  color:rgba(0,0,0,.45);
}

.instruction{
  position:absolute;
  left:28.6%;
  top:83.6%;
  width:35.5%;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4px 12px;
  box-sizing:border-box;
  font-family:"Poppins", Arial, sans-serif;
  font-size:20px;
  font-weight:500;
  color:rgba(0,0,0,.75);
  background:transparent;
}

/* CARTA VERTICAL FLIP */
.vertical-card{
  position:absolute;
  left:63.5%;
  top:23.8%;
  width:22%;
  height:58%;
  z-index:18;
  perspective:1200px;
  cursor:pointer;
}

.vertical-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .65s ease;
}

.vertical-card.open .vertical-inner{
  transform:rotateY(180deg);
}

.vertical-face{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:22px;
  overflow:hidden;
  backface-visibility:hidden;
  box-sizing:border-box;
  box-shadow:14px 18px 0 rgba(64,0,150,.65);
}

.vertical-cover{
  background:var(--color);
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  transform:rotate(8deg);
}

.vertical-cover::before{
  content:"";
  position:absolute;
  width:140%;
  height:140%;
  background:repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.07),
    rgba(255,255,255,.07) 12px,
    transparent 12px,
    transparent 24px
  );
  transform:rotate(8deg);
}

.cover-title{
  position:relative;
  z-index:2;
  font-family:"NauryzRedKends","Poppins",Arial,sans-serif;
  font-size:44pt;
  font-weight:700;
  text-align:center;
  text-transform:uppercase;
}

.cover-sub{
  position:relative;
  z-index:2;
  margin-top:8px;
  font-family:"Poppins", Arial, sans-serif;
  font-size:18px;
  font-weight:500;
  font-style:italic;
}

.vertical-front{
  background:#fff;
  transform:rotateY(180deg) rotate(8deg);
}

.vertical-front img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.close-card{
  position:absolute;
  top:12px;
  right:12px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#000;
  color:white;
  font-size:25px;
  font-weight:900;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:40;
}

.vertical-card.open .close-card{
  display:flex;
}

.shuffle{
  animation:shuffleVertical .7s ease;
}

@keyframes shuffleVertical{
  0%{transform:translate(0,0) rotate(8deg);}
  20%{transform:translate(-35px,18px) rotate(-7deg);}
  45%{transform:translate(28px,-22px) rotate(13deg);}
  70%{transform:translate(-18px,12px) rotate(-4deg);}
  100%{transform:translate(0,0) rotate(8deg);}
}

.alarm{
  animation:shake .15s infinite;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  50%{transform:translateX(4px);}
  75%{transform:translateX(-4px);}
  100%{transform:translateX(0);}
}
</style>
</head>

<body>

<div class="scene" id="scene">

  <div class="controls">
    <button id="shuffleBtn">Barajar</button>
    <button id="nextBtn">Siguiente</button>
  </div>

  <div class="timer" id="timer">
    <img id="timerGif" src="">
    <div>
      <div class="timer-label">TIEMPO RESTANTE</div>
      <span id="timeNumber">30</span>
    </div>
  </div>

  <div class="player-box">
    <input class="name-input" id="playerName" placeholder="TU NOMBRE">
    <div class="top-stars">
      <span class="top-star">☆</span>
      <span class="top-star">☆</span>
      <span class="top-star">☆</span>
      <span class="top-star">☆</span>
      <span class="top-star">☆</span>
      <span class="top-star">☆</span>
    </div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="label">
      <div class="label-title" id="cardTitle">Cargando...</div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="counter" id="counter">1/1</div>
  </div>

  <textarea class="answer-box" id="answerBox" placeholder="Escribe tu respuesta aquí..."></textarea>

  <div class="instruction" id="instructionText">
    La evitación alimenta a la sombra
  </div>

  <div class="vertical-card" id="verticalCard">
    <div class="close-card" id="closeCard">×</div>

    <div class="vertical-inner">
      <div class="vertical-face vertical-cover">
        <div class="cover-title" id="coverTitle">CARTA</div>
        <div class="cover-sub">Toca para revelar</div>
      </div>

      <div class="vertical-face vertical-front">
        <img id="visualGraphic" src="">
      </div>
    </div>
  </div>

</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqZdZ17KRyJDc6ybE8eZKia2XuQ4a5Tba6WzrhFDJ4ejSgZBDU4WdSH54pWkY1BGgZNe79S_77zMiS/pub?gid=343832896&single=true&output=csv";

let cardsData = [];
let currentIndex = 0;
let timerInterval;
let tickInterval;
let timeLeft = 30;
let filledStars = 0;

const scene = document.getElementById("scene");
const verticalCard = document.getElementById("verticalCard");
const timer = document.getElementById("timer");

const cardTitle = document.getElementById("cardTitle");
const questionText = document.getElementById("questionText");
const counter = document.getElementById("counter");
const instructionText = document.getElementById("instructionText");
const timeNumber = document.getElementById("timeNumber");
const timerGif = document.getElementById("timerGif");
const visualGraphic = document.getElementById("visualGraphic");
const coverTitle = document.getElementById("coverTitle");
const answerBox = document.getElementById("answerBox");

function clean(value){
  return (value || "")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .trim();
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cell = "";
  let quote = false;

  for(let i = 0; i < text.length; i++){
    const c = text[i];
    const n = text[i + 1];

    if(c === '"' && quote && n === '"'){
      cell += '"';
      i++;
    }else if(c === '"'){
      quote = !quote;
    }else if(c === "," && !quote){
      row.push(cell);
      cell = "";
    }else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
    }else{
      cell += c;
    }
  }

  if(cell || row.length){
    row.push(cell);
    rows.push(row);
  }

  const headers = rows[0].map(h => clean(h));

  return rows.slice(1).map(r => {
    const item = {};
    headers.forEach((h,i)=>{
      item[h] = clean(r[i]);
    });
    return item;
  }).filter(item => item.pregunta || item.titulo);
}

function loadSheet(){
  fetch(sheetURL + "&cache=" + Date.now())
    .then(response => response.text())
    .then(csv => {
      cardsData = parseCSV(csv);

      if(cardsData.length === 0){
        questionText.textContent = "No hay cartas válidas. Revisa encabezados del Sheet.";
        return;
      }

      currentIndex = 0;
      renderCard();
    })
    .catch(error => {
      console.error("ERROR SHEET:", error);
      questionText.textContent = "No se pudo cargar Google Sheets.";
    });
}

function renderCard(){
  if(!cardsData.length) return;

  const card = cardsData[currentIndex];
  const color = clean(card.color) || "#8A4FF5";

  scene.style.setProperty("--color", color);

  cardTitle.textContent = clean(card.titulo) || "SIN TÍTULO";
  coverTitle.textContent = clean(card.titulo) || "CARTA";
  questionText.textContent = clean(card.pregunta);
  counter.textContent = `${currentIndex + 1}/${cardsData.length}`;
  instructionText.textContent = clean(card.instruccion);

  visualGraphic.src = clean(card.grafica_tiro);

  const cover = document.querySelector(".vertical-cover");

  if(clean(card.grafica_retiro)){
    cover.style.backgroundImage = `url("${clean(card.grafica_retiro)}")`;
    cover.style.backgroundSize = "cover";
    cover.style.backgroundPosition = "center";
  }else{
    cover.style.backgroundImage = "none";
  }

  timeLeft = Number(clean(card.tiempo)) || 30;
  timeNumber.textContent = timeLeft;

  answerBox.value = "";
  verticalCard.classList.remove("open");

  stopTimer();
}

function updateStars(){
  const stars = document.querySelectorAll(".top-star");

  stars.forEach((star,index)=>{
    if(index < filledStars){
      star.textContent = "★";
      star.classList.add("filled");
    }else{
      star.textContent = "☆";
      star.classList.remove("filled");
    }
  });
}

answerBox.addEventListener("keydown",(e)=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();

    if(answerBox.value.trim() !== "" && filledStars < 6){
      filledStars++;
      updateStars();
    }
  }
});

function playShuffleSound(){
  const ctx = new AudioContext();

  for(let i = 0; i < 24; i++){
    const bufferSize = ctx.sampleRate * 0.03;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for(let j = 0; j < bufferSize; j++){
      data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize / 6));
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1800 + Math.random() * 1200;

    const gain = ctx.createGain();
    gain.gain.value = 0.06;

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    const time = ctx.currentTime + i * 0.025;
    noise.start(time);
    noise.stop(time + 0.03);
  }
}

function playTickTackSound(){
  const ctx = new AudioContext();

  function tick(freq, delay){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.045, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.04);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + 0.04);
  }

  tick(900,0);
  tick(620,.45);
}

function playAlarmSound(){
  const ctx = new AudioContext();

  for(let i = 0; i < 12; i++){
    const bell1 = ctx.createOscillator();
    const bell2 = ctx.createOscillator();
    const gain = ctx.createGain();

    bell1.type = "triangle";
    bell2.type = "sine";

    bell1.frequency.value = i % 2 === 0 ? 1550 : 1250;
    bell2.frequency.value = i % 2 === 0 ? 1585 : 1285;

    gain.gain.setValueAtTime(0.32, ctx.currentTime + i * 0.16);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.16 + 0.12);

    bell1.connect(gain);
    bell2.connect(gain);
    gain.connect(ctx.destination);

    const start = ctx.currentTime + i * 0.16;

    bell1.start(start);
    bell2.start(start);
    bell1.stop(start + 0.13);
    bell2.stop(start + 0.13);
  }

  if(navigator.vibrate){
    navigator.vibrate([120,80,120,80,120,80,250]);
  }
}

function startTimer(){
  stopTimer();

  tickInterval = setInterval(()=>{
    playTickTackSound();
  },1000);

  timerInterval = setInterval(()=>{
    timeLeft--;
    timeNumber.textContent = timeLeft;

    if(timeLeft <= 0){
      stopTimer();
      timeNumber.textContent = "0";
      timer.classList.add("alarm");
      playAlarmSound();

      setTimeout(()=>{
        timer.classList.remove("alarm");
      },2200);
    }
  },1000);
}

function stopTimer(){
  clearInterval(timerInterval);
  clearInterval(tickInterval);
}

function revealVerticalCard(){
  verticalCard.classList.add("open");
  startTimer();

  if(navigator.vibrate){
    navigator.vibrate(40);
  }
}

function closeVerticalCard(){
  verticalCard.classList.remove("open");
  stopTimer();
}

function nextCard(){
  currentIndex++;

  if(currentIndex >= cardsData.length){
    currentIndex = 0;
  }

  verticalCard.classList.remove("open");
  verticalCard.classList.add("shuffle");

  setTimeout(()=>{
    verticalCard.classList.remove("shuffle");
    renderCard();
  },450);
}

function shuffleCards(){
  playShuffleSound();

  cardsData.sort(()=>Math.random() - 0.5);
  currentIndex = 0;

  verticalCard.classList.remove("open");
  verticalCard.classList.add("shuffle");

  setTimeout(()=>{
    verticalCard.classList.remove("shuffle");
    renderCard();
  },700);
}

verticalCard.addEventListener("click",(e)=>{
  if(e.target.id === "closeCard"){
    closeVerticalCard();
    return;
  }

  if(!verticalCard.classList.contains("open")){
    revealVerticalCard();
  }
});

document.getElementById("shuffleBtn").addEventListener("click",shuffleCards);
document.getElementById("nextBtn").addEventListener("click",nextCard);

updateStars();
loadSheet();
</script>

</body>
</html>
